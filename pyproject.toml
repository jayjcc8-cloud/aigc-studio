[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-studio"
version = "0.1.0"
description = "Automated AI short-drama production studio for Douyin, Bilibili, YouTube and Instagram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AIGC Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "factory-boy>=3.3",
]
media = [
    "moviepy>=1.0",
    "pydub>=0.25",
    "Pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
aigc = "aigc_core.cli:app"

[tool.setuptools.packages.find]
where = [
    "packages/aigc-core/src",
    "packages/aigc-generation/src",
    "packages/aigc-audio/src",
    "packages/aigc-editing/src",
    "packages/aigc-storyboard/src",
    "packages/aigc-ideation/src",
    "packages/aigc-review/src",
    "packages/aigc-web/src",
    "packages/aigc-workflows/src",
]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG",
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Typer 的 Option()/Argument() 默认值是官方惯用法
"packages/*/src/**/cli.py" = ["B008"]
# 测试中的 mock/fake 对象常需保留协议签名而未使用全部参数
"packages/*/tests/*.py" = ["ARG"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
mypy_path = [
    "packages/aigc-core/src",
    "packages/aigc-generation/src",
    "packages/aigc-audio/src",
    "packages/aigc-editing/src",
    "packages/aigc-storyboard/src",
    "packages/aigc-ideation/src",
    "packages/aigc-review/src",
    "packages/aigc-web/src",
    "packages/aigc-workflows/src",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["packages"]
branch = true

[[tool.mypy.overrides]]
module = "aigc_core.cli"
ignore_errors = true
